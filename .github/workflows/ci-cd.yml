name: CI/CD - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t log-pattern-analyzer:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d --name test-app -p 8080:80 log-pattern-analyzer:${{ github.sha }}
          sleep 3
          curl -f http://localhost:8080 || exit 1
          docker logs test-app
          docker stop test-app

      - name: Tag image as latest
        if: github.ref == 'refs/heads/main'
        run: docker tag log-pattern-analyzer:${{ github.sha }} log-pattern-analyzer:latest

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
